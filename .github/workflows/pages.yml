name: Publish frame

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run build
      - name: Assemble versioned site
        run: |
          mkdir -p _site/v1
          cp -R dist/. _site/v1/
          printf '<!doctype html><title>supersonic-frame</title><h1>supersonic-frame</h1><ul><li><a href="v1/">v1</a></li></ul>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages intermittently reports "Found 0 artifact(s)" seconds after a
      # successful upload (artifact metadata is eventually consistent), which a
      # failed-job re-run cannot fix because re-uploading duplicates the artifact.
      # Retrying the deploy step itself, in the same run, is the fix.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait for artifact metadata to settle before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
